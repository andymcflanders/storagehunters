<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#2563eb" />
		<meta name="description" content="StorageHub - Track your belongings across multiple storage locations" />

		<!-- PWA Meta Tags -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="StorageHub" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />

		<!-- Preconnect to API -->
		<link rel="preconnect" href="/api" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-50 text-slate-900 antialiased">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Service Worker Registration -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch((err) => {
						console.log('ServiceWorker registration failed:', err);
					});
				});
			}
		</script>
	</body>
</html>
