services:
  # Nginx Reverse Proxy (Entry Point)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: storagehub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs_data:/etc/nginx/certs
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: storagehub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storagehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-storagehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storagehub} -d ${POSTGRES_DB:-storagehub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (for Celery background tasks)
  redis:
    image: redis:7-alpine
    container_name: storagehub-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storagehub-backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-storagehub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-storagehub}"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env - generate with openssl rand -hex 32}"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - uploads_data:/app/uploads
      - certs_data:/app/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Celery Worker (background tasks)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storagehub-celery
    command: celery -A app.worker.celery_app worker --loglevel=info -Q celery,ai,default
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-storagehub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-storagehub}"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env}"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat Scheduler (scheduled tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storagehub-celery-beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-storagehub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-storagehub}"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env}"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (SvelteKit)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storagehub-frontend
    depends_on:
      - backend
    restart: unless-stopped

  # Certbot for Let's Encrypt (runs on-demand via exec)
  certbot:
    image: certbot/certbot:latest
    container_name: storagehub-certbot
    volumes:
      - certs_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 1d & wait $${!}; done"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certs_data:
  certbot_www:
